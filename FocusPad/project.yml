name: FocusPad
options:
  bundleIdPrefix: com.magnus.focus
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  FocusCore:
    path: ../FocusCore

targets:
  FocusPad:
    type: application
    platform: iOS
    sources:
      - path: FocusPad
      - path: Shared
    resources:
      - path: Resources
        optional: true
    dependencies:
      - package: FocusCore
        product: FocusCore
      - target: FocusWidgets
        embed: true
      - target: FocusBroadcast
        embed: true
    info:
      path: FocusPad/Info.plist
      properties:
        CFBundleDisplayName: Focus
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - remote-notification
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: "Focus uses your local network to sync the timer instantly between your iPad and Mac on the same Wi-Fi."
        NSHealthShareUsageDescription: "Focus fills untracked time in your day log with Sleep from Apple Health sleep data and Exercise from your workouts."
        NSBonjourServices:
          - _focus-timer._tcp
          - _focus-timer._udp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magnus.focus.iPad
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: FocusPad/FocusPad.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MUR9TJXP6S
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FOCUS_APP

  FocusWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FocusWidgets
      - path: Shared
    dependencies:
      - package: FocusCore
        product: FocusCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: FocusWidgets/Info.plist
      properties:
        CFBundleDisplayName: Focus
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magnus.focus.iPad.widgets
        CODE_SIGN_ENTITLEMENTS: FocusWidgets/FocusWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MUR9TJXP6S
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO

  FocusBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: FocusBroadcast
    dependencies:
      - package: FocusCore
        product: FocusCore
      - sdk: ReplayKit.framework
    info:
      path: FocusBroadcast/Info.plist
      properties:
        CFBundleDisplayName: Focus Screen Notes
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magnus.focus.iPad.broadcast
        CODE_SIGN_ENTITLEMENTS: FocusBroadcast/FocusBroadcast.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MUR9TJXP6S
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
