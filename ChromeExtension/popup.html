<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <div class="row"><span class="dot" id="dot"></span><span id="conn">Checking…</span></div>
  <div class="big" id="status"></div>
  <div class="muted" id="today"></div>
  <details class="sites" id="sites" hidden>
    <summary id="sitesSummary"></summary>
    <ul id="siteList" tabindex="0" aria-label="Configured distracting sites"></ul>
  </details>
  <div class="muted" id="pending"></div>
  <details class="feature youtube" id="youtube">
    <summary><span>YouTube focus</span><span class="summaryValue" id="youtubeSummary">During focus</span></summary>
    <div class="featureBody">
      <div class="seg three" id="youtubeMode" role="group" aria-label="YouTube focus mode">
        <button data-mode="off">Off</button><button data-mode="focus">During focus</button><button data-mode="always">Always</button>
      </div>
      <div class="muted" id="youtubeWhen"></div>
      <div id="youtubeSettings">
        <label class="check"><input type="checkbox" data-youtube="hideHome"> <span><strong>Home feed</strong><small>Keep search and Subscriptions</small></span></label>
        <label class="check"><input type="checkbox" data-youtube="hideRelated"> <span><strong>Related videos</strong><small>Beside and below the player</small></span></label>
        <label class="check"><input type="checkbox" data-youtube="hideShorts"> <span><strong>Shorts</strong><small>Hide shelves and offer regular player</small></span></label>
        <label class="check"><input type="checkbox" data-youtube="hideEndScreens"> <span><strong>End-screen suggestions</strong><small>Leave the video controls available</small></span></label>
        <label class="check"><input type="checkbox" data-youtube="disableAutoplay"> <span><strong>Autoplay</strong><small>Keep the next video from starting</small></span></label>
        <label class="check"><input type="checkbox" data-youtube="hideComments"> <span><strong>Comments</strong><small>Optional; visible by default</small></span></label>
      </div>
    </div>
  </details>
  <div class="dark" id="dark">
    <h2>Dark pages</h2>
    <div class="seg" id="darkMode" role="group" aria-label="Dark page mode">
      <button data-mode="off">Off</button><button data-mode="night">Night</button><button data-mode="system" title="While the Mac is in dark mode">System</button><button data-mode="always">Always</button>
    </div>
    <div class="hours" id="darkHours"><input type="time" id="darkFrom" aria-label="Dark pages start time"> <span class="muted">to</span> <input type="time" id="darkTo" aria-label="Dark pages end time"></div>
    <div class="muted" id="darkWhen"></div>
    <div id="darkTune">
      <label class="slider"><span>Brightness</span><input type="range" min="50" max="150" step="5" id="darkBrightness"><output id="darkBrightnessOut"></output></label>
      <label class="slider"><span>Contrast</span><input type="range" min="50" max="150" step="5" id="darkContrast"><output id="darkContrastOut"></output></label>
    </div>
    <div class="site"><span class="muted" id="darkSite"></span><button id="darkToggle" hidden></button></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
