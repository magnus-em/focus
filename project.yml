name: Focus
options:
  bundleIdPrefix: com.magnus
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  FocusCore:
    path: FocusCore

targets:
  # Only here so xcodebuild can compile the app when build.sh regenerates the
  # provisioning profile; the shipped binary comes from `swift build`.
  VirtualDisplay:
    type: framework
    platform: macOS
    sources:
      - path: VirtualDisplay
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magnus.focus.VirtualDisplay
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MUR9TJXP6S
  Focus:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: FocusCore
        product: FocusCore
      - target: VirtualDisplay
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Focus
        CFBundleDisplayName: Focus
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSLocalNetworkUsageDescription: "Focus uses your local network to sync the timer instantly between your Mac and iPad on the same Wi-Fi."
        NSBonjourServices:
          - _focus-timer._tcp
          - _focus-timer._udp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magnus.focus
        CODE_SIGN_ENTITLEMENTS: Focus.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MUR9TJXP6S
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
